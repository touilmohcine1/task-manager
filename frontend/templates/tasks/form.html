{% extends "base.html" %}
{% block title %}{% if task %}تعديل المهمة{% else %}مهمة جديدة{% endif %} — مهامي{% endblock %}

{% block content %}
<div class="page-header">
  <h1 class="page-title">{% if task %}✏️ تعديل المهمة{% else %}➕ مهمة جديدة{% endif %}</h1>
  <a href="{{ url_for('tasks.index') }}" class="btn btn-outline">← رجوع</a>
</div>

<div class="form-page">
  <form method="POST" class="main-form">
    <div class="form-group">
      <label for="title">عنوان المهمة <span class="required">*</span></label>
      <input type="text" id="title" name="title" required maxlength="200"
             value="{{ task.title if task else '' }}"
             placeholder="اكتب عنوان المهمة..." />
    </div>

    <div class="form-group">
      <label for="description">الوصف</label>
      <textarea id="description" name="description" rows="4"
                placeholder="وصف تفصيلي للمهمة (اختياري)...">{{ task.description if task else '' }}</textarea>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="status">الحالة</label>
        <select id="status" name="status">
          <option value="todo"        {% if task and task.status=='todo' %}selected{% endif %}>⏳ قيد الانتظار</option>
          <option value="in_progress" {% if task and task.status=='in_progress' %}selected{% endif %}>🔄 جارٍ التنفيذ</option>
          <option value="done"        {% if task and task.status=='done' %}selected{% endif %}>✅ مكتملة</option>
        </select>
      </div>

      <div class="form-group">
        <label for="priority">الأولوية</label>
        <select id="priority" name="priority">
          <option value="low"    {% if task and task.priority=='low' %}selected{% endif %}>🟢 منخفضة</option>
          <option value="medium" {% if not task or task.priority=='medium' %}selected{% endif %}>🟡 متوسطة</option>
          <option value="high"   {% if task and task.priority=='high' %}selected{% endif %}>🔴 عالية</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="category_id">التصنيف</label>
        <select id="category_id" name="category_id">
          <option value="">— بدون تصنيف —</option>
          {% for cat in categories %}
          <option value="{{ cat.id }}"
            {% if task and task.category_id == cat.id %}selected{% endif %}>
            {{ cat.icon }} {{ cat.name }}
          </option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label for="due_date">تاريخ الاستحقاق</label>
        <input type="date" id="due_date" name="due_date"
               value="{{ task.due_date.isoformat() if task and task.due_date else '' }}" />
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">
        {% if task %}💾 حفظ التعديلات{% else %}✅ إنشاء المهمة{% endif %}
      </button>
      <a href="{{ url_for('tasks.index') }}" class="btn btn-outline">إلغاء</a>
    </div>
  </form>
</div>
{% endblock %}
