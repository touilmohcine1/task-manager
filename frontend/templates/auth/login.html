{% extends "base.html" %}
{% block title %}تسجيل الدخول — مهامي{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">✅</div>
      <h1>مهامي</h1>
      <p>مرحباً بعودتك، سجّل دخولك للمتابعة</p>
    </div>

    <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form">
      <div class="form-group">
        <label for="email">البريد الإلكتروني</label>
        <input type="email" id="email" name="email" required
               placeholder="your@email.com" autocomplete="email" />
      </div>

      <div class="form-group">
        <label for="password">كلمة المرور</label>
        <input type="password" id="password" name="password" required
               placeholder="••••••••" autocomplete="current-password" />
      </div>

      <div class="form-check">
        <input type="checkbox" id="remember" name="remember" />
        <label for="remember">تذكّرني</label>
      </div>

      <button type="submit" class="btn btn-primary btn-full">تسجيل الدخول</button>
    </form>

    <div class="auth-footer">
      <p>ليس لديك حساب؟ <a href="{{ url_for('auth.register') }}">أنشئ حساباً</a></p>
    </div>
  </div>
</div>
{% endblock %}
