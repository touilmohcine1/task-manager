# ============================================================
# Nginx Config — Task Manager (Ubuntu VM)
# File: /etc/nginx/sites-available/taskmanager
# ============================================================
server {
    listen 80;
    server_name _;   # Replace with your domain or IP

    access_log /var/log/nginx/taskmanager_access.log;
    error_log  /var/log/nginx/taskmanager_error.log;

    # Serve static files directly (faster — bypasses Python)
    location /static/ {
        alias /opt/taskmanager/frontend/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy everything else to Gunicorn
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_redirect     off;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    client_max_body_size 10M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}
