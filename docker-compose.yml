# ============================================================
# Task Manager — Docker Compose
# ============================================================

services:

  # ── MySQL Database ──────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: taskmanager-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: RootPass123!
      MYSQL_DATABASE:      taskmanager
      MYSQL_USER:          taskuser
      MYSQL_PASSWORD:      StrongPass123!
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "taskuser", "-pStrongPass123!"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - tasknet

  # ── Flask App ───────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskmanager-app
    restart: always
    environment:
      FLASK_ENV:     production
      FLASK_DEBUG:   "0"
      SECRET_KEY:    super-secret-change-in-production-32chars
      DB_HOST:       db
      DB_PORT:       "3306"
      DB_NAME:       taskmanager
      DB_USER:       taskuser
      DB_PASSWORD:   StrongPass123!
      APP_HOST:      0.0.0.0
      APP_PORT:      "5000"
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tasknet
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend

  # ── Nginx Reverse Proxy ─────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: taskmanager-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/static:/app/frontend/static:ro
    depends_on:
      - app
    networks:
      - tasknet

volumes:
  db_data:
    name: taskmanager_db_data

networks:
  tasknet:
    name: taskmanager_network
    driver: bridge
